name: Build VST3 (untested wrapper)

on:
  workflow_dispatch:
  push:
    tags: ["vst3-*"]

jobs:
  vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S vst3 -B vst3/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build vst3/build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse vst3/build -Filter "*.vst3" -Directory | ForEach-Object { Copy-Item $_.FullName dist -Recurse }
          Get-ChildItem -Recurse vst3/build -Filter "AI Music Generator.exe" | ForEach-Object { Copy-Item $_.FullName dist }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: AIMusicGenerator-VST3
          path: dist
